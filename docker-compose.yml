# Local Postgres with pgvector (mirrors Aurora PostgreSQL 16 + pgvector).
# Apply the schema with `make migrate` after `docker compose up -d`.
services:
  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: emailrag
      POSTGRES_PASSWORD: emailrag
      POSTGRES_DB: emailrag
    ports:
      - "${EMAIL_RAG_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailrag"]
      interval: 5s
      retries: 10

volumes:
  pgdata:

[project]
name = "email-rag"
version = "0.1.0"
description = "Email RAG SaaS backend: API, sync and ingestion Lambdas"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12",         # Claude Messages API via the Bedrock Runtime endpoint
    "boto3>=1.35",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "aws-lambda-powertools[tracer]>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "moto[s3,sqs,secretsmanager]>=5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
email_rag = ["migrations/*.sql"]
